# Prod: fitness.seliflo-orga.de -> Port 8093, statisches Build aus fitness-app/web/dist
server {
    listen 8093;
    server_name fitness.seliflo-orga.de;
    root /home/a503357/fitness-app/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://localhost:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

